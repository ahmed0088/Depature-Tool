name: Tests
on:
  push:
  pull_request:
# CI only reads the code
permissions:
  contents: read
# a newer push to the same branch replaces a run still waiting or running
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Audit parser dependency
        run: npm install --no-save --no-audit --no-fund graphql@16.11.0 playwright-core@1.49.1
      - name: Syntax check every script
        run: for f in *.js scripts/*.js tests/*.js; do node --check "$f"; done
      - name: Regression tests
        run: node tests/run-tests.js
      - name: Mobile chat lifecycle checks
        run: node tests/chat-mobile.test.js

      - name: Run history checks
        run: node tests/run-history.test.js
      - name: Run history on mobile
        run: node tests/run-history.browser.test.js
      - name: Opera Departures checks
        run: node tests/opera-departures.test.js
      - name: Manual sales and seller requests
        run: node tests/manual-upsells.test.js
      - name: Seller credit decisions and phone confirmation
        run: |
          node tests/package-seller-decision.test.js
          node tests/seller-credit.browser.test.js
      - name: Reviewed sales automation guards
        run: node tests/manual-sales-automation.test.js

      - name: IN-Gauge review and Neorcha reader checks
        run: |
          node tests/ingauge-audit.test.js
          node tests/ingauge-uploads.test.js
          node tests/ingauge-modes.test.js
          node tests/ingauge-reference-cache.test.js
          node tests/neorcha-tweak.test.js

      - name: Monthly revenue reconciliation
        run: |
          node tests/monthly-tally.test.js
          node tests/monthly-tally.browser.test.js

      - name: Save package without navigation jumps
        run: node tests/ingauge-save-position.browser.test.js

      - name: IN-Gauge reviewed apply in browser
        run: node tests/ingauge-readiness.browser.test.js
