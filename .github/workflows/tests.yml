name: Tests
on:
  push:
  pull_request:
# CI only reads the code
permissions:
  contents: read
# a newer push to the same branch replaces a run still waiting or running
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Audit parser dependency
        run: npm install --no-save --no-audit --no-fund graphql@16.11.0 playwright-core@1.49.1 xlsx@0.18.5
      - name: Syntax check every script
        run: for f in *.js scripts/*.js tests/*.js; do node --check "$f"; done
      - name: Login and database connection recovery
        run: |
          node --test tests/database-connection.test.js
          node tests/database-connection.browser.test.js
          node tests/login-update.browser.test.js
      - name: Regression tests
        run: node tests/run-tests.js
      - name: Rented beds yearly counts and Excel exports
        run: |
          node --test tests/rented-beds.test.js
          node tests/rented-beds.browser.test.js

      - name: Mobile chat lifecycle checks
        run: node tests/chat-mobile.test.js

      - name: Phone dropdown menus and hotel choices
        run: |
          node tests/phone-menus.browser.test.js
          node tests/departures-mobile.browser.test.js

      - name: BackTrack appearance and touch controls
        run: node tests/backtrack.browser.test.js

      - name: Run history checks
        run: node tests/run-history.test.js
      - name: Run history on mobile
        run: node tests/run-history.browser.test.js
      - name: Opera Departures checks
        run: |
          node tests/opera-departures.test.js
          node --test tests/departure-source.test.js
          node tests/departure-sync.browser.test.js
          node --test tests/opera-checkout.test.js
          node tests/opera-checkout.browser.test.js
      - name: Manual sales and seller requests
        run: node tests/manual-upsells.test.js
      - name: Seller credit decisions and phone confirmation
        run: |
          node tests/package-seller-decision.test.js
          node tests/seller-credit.browser.test.js
      - name: Reviewed sales automation guards
        run: node tests/manual-sales-automation.test.js

      - name: Fixed sellers in package automation
        run: |
          node tests/ingauge-seller-pins.test.js
          node tests/ingauge-seller-pins.browser.test.js

      - name: Selected posting periods and phone date controls
        run: |
          node tests/ingauge-period.test.js
          node tests/ingauge-period.browser.test.js

      - name: Reviewed money corrections and cloud handoff
        run: |
          node tests/ingauge-reconciliation.test.js
          node tests/ingauge-reconciliation.browser.test.js
          node tests/ingauge-booking-choice.test.js
          node tests/ingauge-booking-choice.browser.test.js
          node --test tests/ingauge-mercure-reconciliation.test.js
          node --test tests/ingauge-split-charges.test.js
          node tests/ingauge-split-charges.browser.test.js
          node --test tests/ingauge-monthly-records.test.js
          node --test tests/ingauge-pm-transfers.test.js
          node tests/ingauge-pm-transfers.browser.test.js
          node --test tests/ingauge-animation.test.js
          node tests/ingauge-animation.browser.test.js
          node tests/ingauge-monthly-records.browser.test.js
          HOTELOPS_MONTHLY_STANDARD=1 node tests/ingauge-monthly-records.browser.test.js
          node tests/ingauge-mercure.browser.test.js
          node --test tests/ingauge-confirmation-links.test.js
          node tests/ingauge-confirmation-links.browser.test.js

      - name: Accor enrollment country and result checks
        run: |
          node tests/accor-enrollment.test.js
          node tests/accor-country.browser.test.js
          node tests/accor-receipts.test.js
          node tests/accor-reload.browser.test.js
          node tests/accor-review.test.js
          node tests/accor-review.browser.test.js
          node tests/accor-long-run.test.js
          node tests/accor-progress.test.js
          node tests/accor-progress.browser.test.js
          node tests/enrolment-links.test.js
          node tests/enrolment-links.browser.test.js
          node --test tests/enrolment-excel.test.js
          node tests/enrolment-excel.browser.test.js

      - name: Purpose report business day and referral column
        run: |
          node tests/purpose-business-date.test.js
          node tests/purpose-reader.browser.test.js
          node tests/purpose-referral.test.js
          node tests/purpose-stay.browser.test.js

      - name: Flexible IN-Gauge settings
        run: |
          node tests/ingauge-settings.test.js
          node tests/ingauge-settings.browser.test.js

      - name: Independent audit hotels
        run: |
          node tests/package-target-context.test.js
          node tests/ingauge-any-hotel.browser.test.js

      - name: IN-Gauge review and Neorcha reader checks
        run: |
          node tests/ingauge-audit.test.js
          node --test tests/ingauge-credit-edit.test.js tests/ingauge-review-state.test.js
          node tests/ingauge-review-loop.browser.test.js
          node tests/ingauge-approval.test.js
          node tests/ingauge-uploads.test.js
          node tests/ingauge-modes.test.js
          node tests/ingauge-reference-cache.test.js
          node tests/neorcha-tweak.test.js
          node tests/neorcha-status.test.js
          node tests/neorcha-status.browser.test.js
          node tests/neorcha-hotels.browser.test.js

      - name: Monthly revenue reconciliation
        run: |
          node tests/monthly-tally.test.js
          node tests/monthly-tally.browser.test.js
          node tests/monthly-difference.test.js
          node tests/monthly-difference.browser.test.js
          node --test tests/ingauge-monthly-assistant.test.js
          node --test tests/ingauge-month-close.test.js
          node tests/ingauge-month-close.browser.test.js
          node --test tests/ingauge-after-apply.test.js
          node tests/ingauge-monthly-assistant.browser.test.js

      - name: Provider amount precision and exact financial-source guards
        run: |
          node tests/ingauge-amounts.test.js
          node tests/ingauge-amounts.browser.test.js

      - name: Reviewed revenue and dashboard processing dates
        run: |
          node tests/ingauge-reviewed.test.js
          node tests/ingauge-reviewed.browser.test.js
          node tests/ingauge-status-memo.browser.test.js

      - name: Daily team overview and guided package audit
        run: |
          node tests/ingauge-overview.test.js
          node tests/ingauge-overview.browser.test.js

      - name: Simple IN-Gauge task screens
        run: node tests/ingauge-simple-ui.browser.test.js

      - name: Save package without navigation jumps
        run: node tests/ingauge-save-position.browser.test.js

      - name: IN-Gauge reviewed apply in browser
        run: node tests/ingauge-readiness.browser.test.js
