name: Tests
on:
  push:
  pull_request:
# a newer push to the same branch replaces a run still waiting or running
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check every script
        run: for f in *.js scripts/*.js tests/*.js; do node --check "$f"; done
      - name: Regression tests
        run: node tests/run-tests.js
