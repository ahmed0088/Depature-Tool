name: Mercure Neorcha read-only verification
on:
  push:
    branches: ['verify/neorcha-mercure-579']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.49.1
      - run: node scripts/neorcha-mercure-verify579.cjs
        env:
          NEORCHA_USER: ${{ secrets.NEORCHA_USER_MERCURE }}
          NEORCHA_PASS: ${{ secrets.NEORCHA_PASS_MERCURE }}
