name: Legacy ACDC enrollment (disabled)
# Retired: use the Accor Loop cloud workflow instead. This placeholder keeps old links
# from silently starting the legacy fc.accor.net / A.C.D.C automation.
on:
  workflow_dispatch:
    inputs:
      retired:
        description: 'This workflow is retired. Use Accor Loop (cloud).'
        required: false
        default: 'retired'
permissions:
  contents: read
jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "This legacy ACDC enrollment workflow is retired. Use Accor Loop (cloud)."
