name: Neorcha (cloud)
run-name: Neorcha · ${{ inputs.tag || 'scheduled' }}
# Collects the Neorcha registration cards on GitHub's machine and saves them in HotelOps
# (scripts/neorcha-cloud.js). Every night by itself, or press "Run workflow" (github.com or the
# GitHub app). Needs the Secrets listed in that script; without them it does nothing.
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Arrivals from (YYYY-MM-DD) — empty = the 1st of this month'
        required: false
        default: ''
      to:
        description: 'Arrivals to (YYYY-MM-DD) — empty = today'
        required: false
        default: ''
      tag:
        description: 'Leave empty (HotelOps fills it, to follow its own run)'
        required: false
        default: ''
      account:
        description: 'Neorcha account — empty = the main one; MERCURE = the NEORCHA_USER_MERCURE / NEORCHA_PASS_MERCURE secrets'
        required: false
        default: ''
      url:
        description: 'Leave empty (HotelOps fills it: the hotel''s Neorcha link)'
        required: false
        default: ''
      fields:
        description: 'Optional JSON array of registration/contact fields selected in HotelOps'
        required: false
        default: ''
      hotel_name:
        description: 'Exact Neorcha hotel display name (HotelOps fills it)'
        required: false
        default: ''
      hid:
        description: 'Leave empty (HotelOps fills it: the hotel the cards go to)'
        required: false
        default: ''
  schedule:
    - cron: '17 23 * * *'   # 03:17 in Dubai
permissions:
  contents: read
concurrency:
  group: neorcha-cloud
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'ahmed0088/depature-tool'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # GitHub's computers already have Google Chrome: use it (no 160 MB browser download); download one only if it is missing
      - name: Browser
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.49.1
          if [ -x /usr/bin/google-chrome ]; then echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"; google-chrome --version; else npx playwright-core install --with-deps chromium; fi
      - name: Collect
        run: node scripts/neorcha-cloud.js
        env:
          FIELDS: ${{ inputs.fields }}
          HOTEL_NAME: ${{ inputs.hotel_name }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          TAG: ${{ inputs.tag }}
          # a hotel's account (account: MERCURE) uses its own secrets NEORCHA_USER_MERCURE / NEORCHA_PASS_MERCURE; the main login is used
          # only for the main hotel's brand (scripts/neorcha-cloud.js decides). The HotelOps login falls back to the main one.
          ACCOUNT: ${{ inputs.account }}
          URL_IN: ${{ inputs.url }}
          NEORCHA_URL: ${{ secrets.NEORCHA_URL }}
          NEORCHA_USER: ${{ secrets.NEORCHA_USER }}
          NEORCHA_PASS: ${{ secrets.NEORCHA_PASS }}
          NEORCHA_URL_ACC: ${{ inputs.account != '' && secrets[format('NEORCHA_URL_{0}', inputs.account)] || '' }}
          NEORCHA_USER_ACC: ${{ inputs.account != '' && secrets[format('NEORCHA_USER_{0}', inputs.account)] || '' }}
          NEORCHA_PASS_ACC: ${{ inputs.account != '' && secrets[format('NEORCHA_PASS_{0}', inputs.account)] || '' }}
          HOTELOPS_EMAIL: ${{ inputs.account != '' && secrets[format('HOTELOPS_EMAIL_{0}', inputs.account)] || secrets.HOTELOPS_EMAIL }}
          HOTELOPS_PASS: ${{ inputs.account != '' && secrets[format('HOTELOPS_PASS_{0}', inputs.account)] || secrets.HOTELOPS_PASS }}
          HOTELOPS_HOTEL: ${{ inputs.hid || (inputs.account != '' && secrets[format('HOTELOPS_HOTEL_{0}', inputs.account)]) || secrets.HOTELOPS_HOTEL }}
