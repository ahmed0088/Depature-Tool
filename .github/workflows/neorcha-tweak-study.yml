name: Neorcha Tweak read-only study
on:
  push:
    branches: ['study/ingauge-20261107-readonly']
    paths: ['scripts/neorcha-tweak-study.cjs','.github/workflows/neorcha-tweak-study.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.49.1 graphql@16.11.0
      - run: node scripts/neorcha-tweak-study.cjs
        env:
          NEORCHA_USER: ${{ secrets.NEORCHA_USER_IBIS || secrets.NEORCHA_USER }}
          NEORCHA_PASS: ${{ secrets.NEORCHA_PASS_IBIS || secrets.NEORCHA_PASS }}
