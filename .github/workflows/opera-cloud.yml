name: Opera fixer (cloud)
run-name: Opera fixer · ${{ inputs.mode || 'signin' }} · ${{ inputs.tag || 'manual' }}
# Signs in to Opera Cloud on GitHub's machine and runs the HotelOps profile fixer (scripts/opera-cloud.js).
# mode signin = only sign in and open In House (no guest data touched). audit = read-only. save = fill empty fields and Save.
# Needs the Secrets OPERA_USER and OPERA_PASS (the same Microsoft login for every hotel) and the HOTELOPS_* ones Neorcha already uses.
# The hotel is the 'url' input (not a secret). The 6-digit code is typed in HotelOps each run.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'signin (test), audit (read-only, uses the plan sent from HotelOps) or save (fills empty fields and Saves, only if Save was switched on in HotelOps)'
        required: false
        default: 'signin'
      url:
        description: 'The hotel Opera Cloud link (paste the address you open Opera with). Empty = the OPERA_URL secret if there is one'
        required: false
        default: ''
      tag:
        description: 'Private run reference created by HotelOps'
        required: false
        default: ''
      hotel:
        description: 'HotelOps workspace for the reviewed plan and authentication code'
        required: false
        default: ''
      limit:
        description: 'Only the first N rooms (0 = all)'
        required: false
        default: '2'
permissions:
  contents: read
concurrency:
  group: opera-cloud
  cancel-in-progress: false
jobs:
  run:
    if: github.repository == 'ahmed0088/Depature-Tool'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Browser
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.49.1
          if [ -x /usr/bin/google-chrome ]; then echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"; else npx playwright-core install --with-deps chromium; fi
      - name: Run
        run: node scripts/opera-cloud.js
        env:
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
          OPERA_URL: ${{ inputs.url || secrets.OPERA_URL }}
          OPERA_USER: ${{ secrets.OPERA_USER }}
          OPERA_PASS: ${{ secrets.OPERA_PASS }}
          OPERA_TOTP: ${{ secrets.OPERA_TOTP }}
          HOTELOPS_EMAIL: ${{ secrets.HOTELOPS_EMAIL }}
          HOTELOPS_PASS: ${{ secrets.HOTELOPS_PASS }}
          HOTELOPS_HOTEL: ${{ inputs.hotel || secrets.HOTELOPS_HOTEL }}
          RUN_TAG: ${{ inputs.tag }}
      - name: Cleanup (always, also when cancelled or failed)
        if: always()
        run: node scripts/opera-cloud.js
        env:
          MODE: cleanup
          CLEANUP_MAX_MIN: ${{ (inputs.mode || 'signin') == 'signin' && '180' || '' }}
          HOTELOPS_EMAIL: ${{ secrets.HOTELOPS_EMAIL }}
          HOTELOPS_PASS: ${{ secrets.HOTELOPS_PASS }}
          HOTELOPS_HOTEL: ${{ inputs.hotel || secrets.HOTELOPS_HOTEL }}
          RUN_TAG: ${{ inputs.tag }}
